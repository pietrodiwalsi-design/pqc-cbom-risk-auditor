name: Automated CBOM & PQC Audit Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pqc-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Execute CBOM & PQC Test Suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/ -v
          python -c "from pqc_auditor.cbom_parser import CBOMParser; cbom = CBOMParser().scan_directory('.'); print(f'CBOM Scan Successful. Findings: {cbom[\"metadata\"][\"total_cryptographic_findings\"]}')"
